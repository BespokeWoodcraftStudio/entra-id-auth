name: Setup problem
description: The setup or the skill stopped, said something wrong, or did the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove anything private before you paste: tenant ids, client ids, secrets, real addresses and domains. Never put a vulnerability here; use the private report link on the issue chooser.
  - type: input
    id: step
    attributes:
      label: Which step
      description: The step or question you were on, in your own words (for example "it asked for my site address"). The step number from SETUP.md or SKILL.md is welcome if you have it.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and computer
      description: For example "Claude Code 2.1, macOS" or "another agent, Windows with WSL".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of the script or command
      description: Paste it with ids and secrets removed.
      render: text
